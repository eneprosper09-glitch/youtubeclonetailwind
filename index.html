    <!-- Custom styles -->
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f0f0f; }
        ::-webkit-scrollbar-thumb { background: #606060; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #808080; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-card { cursor: pointer; transition: transform 0.2s ease; }
        .video-card:hover { transform: scale(1.02); }
        .shorts-card { cursor: pointer; transition: transform 0.2s ease; flex-shrink: 0; }
        .shorts-card:hover { transform: scale(1.05); }
        .shorts-wrapper { position: relative; }
        .shorts-scroll-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            background: rgba(0,0,0,0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .shorts-scroll-btn:hover { background: rgba(255,255,255,0.2); }
        .shorts-scroll-btn.left { left: -10px; }
        .shorts-scroll-btn.right { right: -10px; }
        .shorts-scroll-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        @media (max-width: 768px) {
            .shorts-scroll-btn { width: 30px; height: 30px; font-size: 14px; }
            .shorts-scroll-btn.left { left: -5px; }
            .shorts-scroll-btn.right { right: -5px; }
        }

        /* Sidebar */
        .sidebar-transition {
            transition: transform 0.3s ease, width 0.3s ease;
        }
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #606060; border-radius: 2px; }
        .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }

        /* Sidebar collapsed state */
        #sidebar.collapsed .sidebar-text { display: none; }
        #sidebar.collapsed .sidebar-icon { margin-right: 0; }
        #sidebar.collapsed .sidebar-item { justify-content: center; padding: 8px 12px; }
        #sidebar.collapsed .sidebar-heading { display: none; }
        #sidebar.collapsed .sidebar-divider { display: none; }
        #sidebar.collapsed .sidebar-hide-on-collapse { display: none; }

        /* Hide collapse toggle on mobile */
        .collapse-toggle { display: none; }
        @media (min-width: 768px) {
            .collapse-toggle { display: flex; }
        }
    </style>
</head>

                grid.innerHTML = `
                    <div class="col-span-full text-center text-gray-400 py-12">
                        <p class="text-xl">No videos found</p>
                        <p class="text-sm mt-2">Try adjusting your search or filter</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = videoList.map(v => `
                <div class="video-card" data-id="${v.id}">
                    <div class="relative rounded-xl overflow-hidden bg-[#1a1a1a]">
                        <img src="${v.thumbnail}" alt="${v.title}" class="w-full aspect-video object-cover" loading="lazy" onerror="this.src='https://via.placeholder.com/320x180/1a1a1a/888?text=No+Image'" />
                        <span class="absolute bottom-2 right-2 bg-black/90 text-white text-xs px-1.5 py-0.5 rounded">${v.duration}</span>
                    </div>
                    <div class="flex gap-3 mt-3">
                        <div class="w-9 h-9 rounded-full bg-blue-500 text-black flex items-center justify-center font-bold text-sm flex-shrink-0">${v.avatar}</div>
                        <div>
                            <h3 class="text-sm font-medium line-clamp-2">${v.title}</h3>
                            <p class="text-xs text-gray-400 mt-1">${v.channel}</p>
                            <p class="text-xs text-gray-400">${v.views} views • ${v.uploaded}</p>
                        </div>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.video-card').forEach(card => {
                card.addEventListener('click', function() {
                    const id = this.dataset.id;
                    localStorage.setItem('selectedVideoId', id);
                    window.location.href = 'watch.html';
                });
            });
        }

        // =============================================
        // RENDER SHORTS
        // =============================================
        function renderShorts(shortsList) {
            const grid = document.getElementById('shortsGrid');
            if (!grid) {
                console.error('shortsGrid not found!');
                return;
            }
            
            grid.innerHTML = shortsList.map(s => `
                <div class="shorts-card w-40" data-id="${s.id}">
                    <img src="${s.thumbnail}" alt="${s.title}" class="w-full aspect-[9/16] object-cover rounded-xl" loading="lazy" onerror="this.src='https://via.placeholder.com/180x320/1a1a1a/888?text=No+Image'" />
                    <div class="mt-2">
                        <h4 class="text-sm font-medium line-clamp-2">${s.title}</h4>
                        <p class="text-xs text-gray-400">${s.views} views</p>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.shorts-card').forEach(card => {
                card.addEventListener('click', function() {
                    const id = this.dataset.id;
                    localStorage.setItem('selectedShortId', id);
                    window.location.href = 'shorts-page.html';
                });
            });
        }

        // =============================================
        // SHORTS SCROLL BUTTONS
        // =============================================
        function setupShortsScroll() {
            const grid = document.getElementById('shortsGrid');
            const leftBtn = document.getElementById('shortsScrollLeft');
            const rightBtn = document.getElementById('shortsScrollRight');
            
            if (!grid || !leftBtn || !rightBtn) return;

            function updateButtons() {
                const scrollLeft = grid.scrollLeft;
                const maxScroll = grid.scrollWidth - grid.clientWidth;
                leftBtn.disabled = scrollLeft <= 0;
                rightBtn.disabled = scrollLeft >= maxScroll - 1;
            }

            leftBtn.addEventListener('click', () => {
                grid.scrollBy({ left: -200, behavior: 'smooth' });
                setTimeout(updateButtons, 300);
            });

            rightBtn.addEventListener('click', () => {
                grid.scrollBy({ left: 200, behavior: 'smooth' });
                setTimeout(updateButtons, 300);
            });

            grid.addEventListener('scroll', updateButtons);
            window.addEventListener('resize', updateButtons);
            setTimeout(updateButtons, 100);
        }

        // =============================================
        // FILTERS & SEARCH
        // =============================================
        let currentCategory = 'all';
        let currentSearch = '';

        function filterVideos() {
            let filtered = videos;
            if (currentCategory !== 'all') {
                filtered = filtered.filter(v => v.category === currentCategory);
            }
            if (currentSearch.trim()) {
                const search = currentSearch.toLowerCase().trim();
                filtered = filtered.filter(v =>
                    v.title.toLowerCase().includes(search) ||
                    v.channel.toLowerCase().includes(search)
                );
            }
            renderVideos(filtered);
        }

        // =============================================
        // SIDEBAR TOGGLE & COLLAPSE
        // =============================================
        function setupSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const toggle = document.getElementById('menuToggle');
            const collapseToggle = document.getElementById('collapseToggle');
            const main = document.getElementById('mainContent');
            const isMobile = () => window.innerWidth < 768;

            // Toggle sidebar visibility (mobile) / collapse (desktop)
            function toggleSidebar() {
                if (isMobile()) {
                    // Mobile: slide in/out
                    const isOpen = !sidebar.classList.contains('-translate-x-full');
                    if (isOpen) {
                        sidebar.classList.add('-translate-x-full');
                        if (overlay) overlay.classList.add('hidden');
                    } else {
                        sidebar.classList.remove('-translate-x-full');
                        if (overlay) overlay.classList.remove('hidden');
                    }
                } else {
                    // Desktop: toggle collapse
                    sidebar.classList.toggle('collapsed');
                    if (sidebar.classList.contains('collapsed')) {
                        sidebar.style.width = '64px';
                        if (main) {
                            main.classList.remove('md:ml-64');
                            main.classList.add('md:ml-16');
                        }
                        if (collapseToggle) {
                            collapseToggle.innerHTML = '<span class="text-xl">▶</span><span class="sidebar-text text-sm">Expand</span>';
                        }
                    } else {
                        sidebar.style.width = '256px';
                        if (main) {
                            main.classList.remove('md:ml-16');
                            main.classList.add('md:ml-64');
                        }
                        if (collapseToggle) {
                            collapseToggle.innerHTML = '<span class="text-xl">◀</span><span class="sidebar-text text-sm">Collapse</span>';
                        }
                    }
                }
            }

            // Menu toggle (hamburger)
            if (toggle) {
                toggle.addEventListener('click', toggleSidebar);
            }

            // Collapse toggle (desktop only)
            if (collapseToggle) {
                collapseToggle.addEventListener('click', toggleSidebar);
            }

            // Overlay click (mobile)
            if (overlay) {
                overlay.addEventListener('click', function() {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                });
            }

            // Handle resize
            window.addEventListener('resize', function() {
                if (window.innerWidth >= 768) {
                    // Desktop: ensure sidebar is visible
                    sidebar.classList.remove('-translate-x-full');
                    if (overlay) overlay.classList.add('hidden');
                    // If collapsed state is stored in class, keep it
                    if (!sidebar.classList.contains('collapsed')) {
                        sidebar.style.width = '256px';
                        if (main) {
                            main.classList.remove('md:ml-16');
                            main.classList.add('md:ml-64');
                        }
                        if (collapseToggle) {
                            collapseToggle.innerHTML = '<span class="text-xl">◀</span><span class="sidebar-text text-sm">Collapse</span>';
                        }
                    } else {
                        sidebar.style.width = '64px';
                        if (main) {
                            main.classList.remove('md:ml-64');
                            main.classList.add('md:ml-16');
                        }
                        if (collapseToggle) {
                            collapseToggle.innerHTML = '<span class="text-xl">▶</span><span class="sidebar-text text-sm">Expand</span>';
                        }
                    }
                } else {
                    // Mobile: hide sidebar
                    sidebar.classList.add('-translate-x-full');
                    sidebar.classList.remove('collapsed');
                    sidebar.style.width = '256px';
                    if (main) {
                        main.classList.remove('md:ml-64', 'md:ml-16');
                    }
                    if (overlay) overlay.classList.add('hidden');
                }
            });

            // Set initial state (desktop open, mobile hidden)
            if (window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
                sidebar.classList.remove('collapsed');
                sidebar.style.width = '256px';
                if (main) {
                    main.classList.remove('md:ml-64', 'md:ml-16');
                }
            } else {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.remove('collapsed');
                sidebar.style.width = '256px';
                if (main) {
                    main.classList.remove('md:ml-16');
                    main.classList.add('md:ml-64');
                }
            }
        }

        // =============================================
        // INITIALIZE
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, videos count:', videos.length);
            
            renderVideos(videos);
            renderShorts(shorts);
            setupSidebar();
            setupShortsScroll();
            
            // Category buttons
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.category-btn').forEach(b => {
                        b.classList.remove('bg-white', 'text-black');
                        b.classList.add('bg-[#272727]', 'text-white');
                    });
                    this.classList.add('bg-white', 'text-black');
                    this.classList.remove('bg-[#272727]', 'text-white');
                    currentCategory = this.dataset.category;
                    filterVideos();
                });
            });
            
            // Search
            const searchBtn = document.getElementById('searchBtn');
            const searchInput = document.getElementById('searchInput');
            
            if (searchBtn) {
                searchBtn.addEventListener('click', function() {
                    currentSearch = searchInput ? searchInput.value : '';
                    filterVideos();
                });
            }
            
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        currentSearch = this.value;
                        filterVideos();
                    }
                });
            }
        });
    </script>

</body>
</html>
