        #sidebar.collapsed .sidebar-divider { display: none; }

        .collapse-toggle { display: none; }
        @media (min-width: 768px) {

        .video-card {
            cursor: pointer;

            { id: 16, title: "Psychology of Money in Just 10 Minutes", channel: "Becoming More", avatar: "B", views: "1.7M", uploaded: "1 year ago", thumbnail: "https://i.ytimg.com/vi/yhq1cPRHR6k/hqdefault.jpg", category: "live", duration: "10:00", url: "https://youtu.be/yhq1cPRHR6k", description: "The Psychology of Money by Morgan Housel summarized." },

        ];

        // =============================================
        // CATEGORY INFO
        // =============================================
        var categoryInfo = {
            trending: { title: 'Trending', icon: '🔥' },
            music: { title: 'Music', icon: '♫' },
            gaming: { title: 'Gaming', icon: '🎮' },
            news: { title: 'News', icon: '📰' },
            sports: { title: 'Sports', icon: '⚽' },
            movies: { title: 'Movies & TV', icon: '🎬' }
        };

        // =============================================
        // GET CATEGORY FROM URL
        // =============================================
        var urlParams = new URLSearchParams(window.location.search);
        var currentCategory = urlParams.get('category') || 'trending';

        // =============================================
        // LOAD EXPLORE CATEGORY
        // =============================================
        function loadExploreCategory(category) {
            var grid = document.getElementById('exploreGrid');
            var emptyState = document.getElementById('emptyState');
            var title = document.getElementById('categoryTitle');
            var icon = document.getElementById('categoryIcon');
            var count = document.getElementById('categoryCount');

            var info = categoryInfo[category] || categoryInfo.trending;
            title.textContent = info.title;
            icon.textContent = info.icon;

            // Filter videos
            var filteredVideos = [];
            var currentCategoryLower = category.toLowerCase();

            if (currentCategoryLower === 'trending') {
                // Trending: videos with high views
                filteredVideos = videos.filter(function(video) {
                    var viewCount = 0;
                    if (video.views) {
                        var viewStr = video.views.replace(/[^0-9.]/g, '');
                        var num = parseFloat(viewStr) || 0;
                        if (video.views.indexOf('B') !== -1) viewCount = num * 1000000000;
                        else if (video.views.indexOf('M') !== -1) viewCount = num * 1000000;
                        else if (video.views.indexOf('K') !== -1) viewCount = num * 1000;
                        else viewCount = num;
                    }
                    return viewCount > 500000;
                });
                // Sort by views (highest first)
                filteredVideos.sort(function(a, b) {
                    var viewA = 0, viewB = 0;
                    if (a.views) {
                        var viewStrA = a.views.replace(/[^0-9.]/g, '');
                        var numA = parseFloat(viewStrA) || 0;
                        if (a.views.indexOf('B') !== -1) viewA = numA * 1000000000;
                        else if (a.views.indexOf('M') !== -1) viewA = numA * 1000000;
                        else if (a.views.indexOf('K') !== -1) viewA = numA * 1000;
                        else viewA = numA;
                    }
                    if (b.views) {
                        var viewStrB = b.views.replace(/[^0-9.]/g, '');
                        var numB = parseFloat(viewStrB) || 0;
                        if (b.views.indexOf('B') !== -1) viewB = numB * 1000000000;
                        else if (b.views.indexOf('M') !== -1) viewB = numB * 1000000;
                        else if (b.views.indexOf('K') !== -1) viewB = numB * 1000;
                        else viewB = numB;
                    }
                    return viewB - viewA;
                });
            } else {
                // Regular category filter
                filteredVideos = videos.filter(function(video) {
                    return video.category === currentCategoryLower;
                });
            }

            // Update count
            count.textContent = filteredVideos.length + ' video' + (filteredVideos.length !== 1 ? 's' : '');

            // Show/hide empty state
            if (filteredVideos.length === 0) {
                emptyState.classList.remove('hidden');
                grid.innerHTML = '';
                return;
            }
            emptyState.classList.add('hidden');

            // Render videos
            renderExploreVideos(filteredVideos);

            // Update active category button
            document.querySelectorAll('.category-btn').forEach(function(btn) {
                btn.classList.remove('active');
                if (btn.dataset.category === currentCategoryLower) {
                    btn.classList.add('active');
                }
            });
        }

        // =============================================
        // RENDER EXPLORE VIDEOS
        // =============================================
        function renderExploreVideos(videoList) {
            var grid = document.getElementById('exploreGrid');

            grid.innerHTML = videoList.map(function(video) {
                return `
                    <div class="video-card" data-id="${video.id}">
                        <div class="relative rounded-xl overflow-hidden bg-[#1a1a1a]">
                            <img src="${video.thumbnail}" alt="${video.title}" class="w-full aspect-video object-cover" loading="lazy" onerror="this.src='https://via.placeholder.com/320x180/1a1a1a/888?text=No+Image'" />
                            <span class="absolute bottom-2 right-2 bg-black/90 text-white text-xs px-1.5 py-0.5 rounded">${video.duration}</span>
                        </div>
                        <div class="flex gap-3 mt-3">
                            <div class="w-9 h-9 rounded-full bg-blue-500 text-black flex items-center justify-center font-bold text-sm flex-shrink-0">${video.avatar}</div>
                            <div>
                                <h3 class="text-sm font-medium line-clamp-2">${video.title}</h3>
                                <p class="text-xs text-gray-400 mt-1">${video.channel}</p>
                                <p class="text-xs text-gray-400">${video.views} views • ${video.uploaded}</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Click to go to watch page
            document.querySelectorAll('#exploreGrid .video-card').forEach(function(card) {
                card.addEventListener('click', function() {
                    var id = this.dataset.id;
                    localStorage.setItem('selectedVideoId', id);
                    window.location.href = 'watch.html';
                });
            });
        }

        function setupSidebar() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebarOverlay');
            var toggle = document.getElementById('menuToggle');
            var collapseToggle = document.getElementById('collapseToggle');
            var main = document.getElementById('mainContent');

            function isMobile() {
                return window.innerWidth < 768;
            }

            function toggleSidebar() {
                if (isMobile()) {
                    var isOpen = !sidebar.classList.contains('-translate-x-full');
                    if (isOpen) {
                        sidebar.classList.add('-translate-x-full');
                        if (overlay) overlay.classList.add('hidden');
                    } else {
                        sidebar.classList.remove('-translate-x-full');
                        if (overlay) overlay.classList.remove('hidden');
                    }
                } else {
                    sidebar.classList.toggle('collapsed');
                    if (sidebar.classList.contains('collapsed')) {
                        sidebar.style.width = '64px';
                        if (main) {
                            main.classList.remove('md:ml-64');
                            main.classList.add('md:ml-16');
                        }
                        if (collapseToggle) {
                            collapseToggle.innerHTML = '<span class="text-xl">▶</span><span class="sidebar-text text-sm">Expand</span>';
                        }
                    } else {
                        sidebar.style.width = '256px';
                        if (main) {
                            main.classList.remove('md:ml-16');
                            main.classList.add('md:ml-64');
                        }
                        if (collapseToggle) {
                            collapseToggle.innerHTML = '<span class="text-xl">◀</span><span class="sidebar-text text-sm">Collapse</span>';
                        }
                    }
                }
            }

            if (toggle) {
                toggle.addEventListener('click', toggleSidebar);
            }

            if (collapseToggle) {
                collapseToggle.addEventListener('click', toggleSidebar);
            }

            if (overlay) {
                overlay.addEventListener('click', function() {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                });
            }

            window.addEventListener('resize', function() {
                if (window.innerWidth >= 768) {
                    sidebar.classList.remove('-translate-x-full');
                    if (overlay) overlay.classList.add('hidden');
                    if (!sidebar.classList.contains('collapsed')) {
                        sidebar.style.width = '256px';
                        if (main) {
                            main.classList.remove('md:ml-16');
                            main.classList.add('md:ml-64');
                        }
                        if (collapseToggle) {
                            collapseToggle.innerHTML = '<span class="text-xl">◀</span><span class="sidebar-text text-sm">Collapse</span>';
                        }
                    } else {
                        sidebar.style.width = '64px';
                        if (main) {
                            main.classList.remove('md:ml-64');
                            main.classList.add('md:ml-16');
                        }
                        if (collapseToggle) {
                            collapseToggle.innerHTML = '<span class="text-xl">▶</span><span class="sidebar-text text-sm">Expand</span>';
                        }
                    }
                } else {
                    sidebar.classList.add('-translate-x-full');
                    sidebar.classList.remove('collapsed');
                    sidebar.style.width = '256px';
                    if (main) {
                        main.classList.remove('md:ml-64', 'md:ml-16');
                    }
                    if (overlay) overlay.classList.add('hidden');
                }
            });

            if (window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
                sidebar.classList.remove('collapsed');
                sidebar.style.width = '256px';
                if (main) {
                    main.classList.remove('md:ml-64', 'md:ml-16');
                }
            } else {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.remove('collapsed');
                sidebar.style.width = '256px';
                if (main) {
                    main.classList.remove('md:ml-16');
                    main.classList.add('md:ml-64');
                }
            }
        }

        // =============================================
        // INITIALIZE
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadExploreCategory(currentCategory);
            setupSidebar();

            // Category buttons
            document.querySelectorAll('.category-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var category = this.dataset.category;
                    // Update URL
                    var url = new URL(window.location);
                    url.searchParams.set('category', category);
                    window.history.pushState({}, '', url);
                    currentCategory = category;
                    loadExploreCategory(category);
                });
            });
        });
    </script>

</body>
</html>
