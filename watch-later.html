    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f0f0f; }
        ::-webkit-scrollbar-thumb { background: #606060; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #808080; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar-transition {
            transition: transform 0.3s ease, width 0.3s ease;
        }
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #606060; border-radius: 2px; }
        .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }

        #sidebar.collapsed .sidebar-text { display: none; }
        #sidebar.collapsed .sidebar-icon { margin-right: 0; }
        #sidebar.collapsed .sidebar-item { justify-content: center; padding: 8px 12px; }
        #sidebar.collapsed .sidebar-heading { display: none; }
        #sidebar.collapsed .sidebar-divider { display: none; }
        #sidebar.collapsed .sidebar-hide-on-collapse { display: none; }

        .collapse-toggle { display: none; }
        @media (min-width: 768px) {
            .collapse-toggle { display: flex; }
        }

        .video-card { cursor: pointer; transition: transform 0.2s ease; }
        .video-card:hover { transform: scale(1.02); }

        .remove-btn {
            transition: all 0.2s ease;
        }
        .remove-btn:hover {
            background: #cc0000 !important;
            color: white !important;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #f1f1f1;
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid #272727;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .toast.show { opacity: 1; pointer-events: auto; }
    </style>
</head>

    <!-- ==========================================

    ========================================== -->

            { id: 15, title: "Project Manuscript II Assessment Guide", channel: "Rony OnlineGigs", avatar: "R", views: "477", uploaded: "19 hours ago", thumbnail: "https://i.ytimg.com/vi/BJDyuBhrVAk/hqdefault.jpg", category: "gaming", duration: "24:18", url: "https://youtu.be/BJDyuBhrVAk", description: "A step-by-step guide for Project Manuscript II assessment." },
            { id: 16, title: "Psychology of Money in Just 10 Minutes", channel: "Becoming More", avatar: "B", views: "1.7M", uploaded: "1 year ago", thumbnail: "https://i.ytimg.com/vi/yhq1cPRHR6k/hqdefault.jpg", category: "live", duration: "10:00", url: "https://youtu.be/yhq1cPRHR6k", description: "The Psychology of Money by Morgan Housel summarized." },
            { id: 17, title: "The Terrifying Paradox of Self-Awareness", channel: "Aperture", avatar: "A", views: "920K", uploaded: "5 months ago", thumbnail: "https://i.ytimg.com/vi/3x6hiS0E_7w/hqdefault.jpg", category: "news", duration: "14:30", url: "https://youtu.be/3x6hiS0E_7w", description: "A deep dive into the paradox of self-awareness." },
            { id: 18, title: "How to Read Anyone Instantly", channel: "Thynksee", avatar: "T", views: "3.2M", uploaded: "1 year ago", thumbnail: "https://i.ytimg.com/vi/iYfPqg7aXH8/hqdefault.jpg", category: "news", duration: "18:45", url: "https://youtu.be/iYfPqg7aXH8", description: "Nietzsche's 18 psychological truths on how to read people." }
        ];

        // =============================================
        // TOAST
        // =============================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // =============================================
        // LOAD WATCH LATER
        // =============================================
        function loadWatchLater() {
            const grid = document.getElementById('watchLaterGrid');
            const count = document.getElementById('watchLaterCount');
            const emptyState = document.getElementById('emptyState');
            
            let watchLater = JSON.parse(localStorage.getItem('watchLater')) || [];

            // Get full video details for each saved item
            const savedVideos = watchLater.map(item => {
                const video = videos.find(v => v.id === item.id);
                return video ? { ...video, addedAt: item.addedAt } : null;
            }).filter(v => v !== null);

            // Update count
            count.textContent = savedVideos.length + ' video' + (savedVideos.length !== 1 ? 's' : '') + ' saved';

            // Show/hide empty state
            if (savedVideos.length === 0) {
                emptyState.classList.remove('hidden');
                grid.innerHTML = '';
                return;
            }
            emptyState.classList.add('hidden');

            // Render videos
            grid.innerHTML = savedVideos.map((video, index) => `
                <div class="video-card relative group" data-id="${video.id}">
                    <div class="relative rounded-xl overflow-hidden bg-[#1a1a1a]">
                        <img src="${video.thumbnail}" alt="${video.title}" class="w-full aspect-video object-cover" loading="lazy" onerror="this.src='https://via.placeholder.com/320x180/1a1a1a/888?text=No+Image'" />
                        <span class="absolute bottom-2 right-2 bg-black/90 text-white text-xs px-1.5 py-0.5 rounded">${video.duration}</span>
                        <div class="absolute top-2 left-2 bg-blue-500/90 text-black text-xs px-2 py-1 rounded flex items-center gap-1">
                            <i class="fas fa-clock"></i> Watch Later
                        </div>
                    </div>
                    <div class="flex gap-3 mt-3">
                        <div class="w-9 h-9 rounded-full bg-blue-500 text-black flex items-center justify-center font-bold text-sm flex-shrink-0">${video.avatar}</div>
                        <div class="flex-1 min-w-0">
                            <h3 class="text-sm font-medium line-clamp-2">${video.title}</h3>
                            <p class="text-xs text-gray-400 mt-1">${video.channel}</p>
                            <p class="text-xs text-gray-400">${video.views} views • ${video.uploaded}</p>
                        </div>
                    </div>
                    <button class="remove-btn absolute top-2 right-2 bg-black/80 text-white p-2 rounded-full opacity-0 group-hover:opacity-100 transition hover:bg-red-600" data-index="${index}">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');

            // Click to watch
            document.querySelectorAll('.video-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    if (e.target.closest('.remove-btn')) return;
                    const id = this.dataset.id;
                    localStorage.setItem('selectedVideoId', id);
                    window.location.href = 'watch.html';
                });
            });

            // Remove buttons
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const index = parseInt(this.dataset.index);
                    removeFromWatchLater(index);
                });
            });
        }

        // =============================================
        // REMOVE FROM WATCH LATER
        // =============================================
        function removeFromWatchLater(index) {
            let watchLater = JSON.parse(localStorage.getItem('watchLater')) || [];
            const video = watchLater[index];
            if (!video) return;

            if (confirm(`Remove "${video.title}" from Watch Later?`)) {
                watchLater.splice(index, 1);
                localStorage.setItem('watchLater', JSON.stringify(watchLater));
                loadWatchLater();
                showToast('⏰ Removed from Watch Later');
            }
        }

        // =============================================
        // CLEAR ALL
        // =============================================
        document.getElementById('clearAllBtn').addEventListener('click', function() {
            let watchLater = JSON.parse(localStorage.getItem('watchLater')) || [];
            if (watchLater.length === 0) {
                showToast('📭 Watch Later is already empty');
                return;
            }
            if (confirm('Clear all videos from Watch Later?')) {
                localStorage.removeItem('watchLater');
                loadWatchLater();
                showToast('🗑️ Watch Later cleared');
            }
        });

        // =============================================
        // SIDEBAR TOGGLE & COLLAPSE
        // =============================================
        function setupSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const toggle = document.getElementById('menuToggle');
            const collapseToggle = document.getElementById('collapseToggle');
            const main = document.getElementById('mainContent');
            const isMobile = () => window.innerWidth < 768;

            function toggleSidebar() {
                if (isMobile()) {
                    const isOpen = !sidebar.classList.contains('-translate-x-full');
                    if (isOpen) {
                        sidebar.classList.add('-translate-x-full');
                        if (overlay) overlay.classList.add('hidden');
                    } else {
                        sidebar.classList.remove('-translate-x-full');
                        if (overlay) overlay.classList.remove('hidden');
                    }
                } else {
                    sidebar.classList.toggle('collapsed');
                    if (sidebar.classList.contains('collapsed')) {
                        sidebar.style.width = '64px';
                        if (main) {
                            main.classList.remove('md:ml-64');
                            main.classList.add('md:ml-16');
                        }
                        if (collapseToggle) {
                            collapseToggle.innerHTML = '<span class="text-xl">▶</span><span class="sidebar-text text-sm">Expand</span>';
                        }
                    } else {
                        sidebar.style.width = '256px';
                        if (main) {
                            main.classList.remove('md:ml-16');
                            main.classList.add('md:ml-64');
                        }
                        if (collapseToggle) {
                            collapseToggle.innerHTML = '<span class="text-xl">◀</span><span class="sidebar-text text-sm">Collapse</span>';
                        }
                    }
                }
            }

            if (toggle) toggle.addEventListener('click', toggleSidebar);
            if (collapseToggle) collapseToggle.addEventListener('click', toggleSidebar);
            if (overlay) {
                overlay.addEventListener('click', function() {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                });
            }

            window.addEventListener('resize', function() {
                if (window.innerWidth >= 768) {
                    sidebar.classList.remove('-translate-x-full');
                    if (overlay) overlay.classList.add('hidden');
                    if (!sidebar.classList.contains('collapsed')) {
                        sidebar.style.width = '256px';
                        if (main) {
                            main.classList.remove('md:ml-16');
                            main.classList.add('md:ml-64');
                        }
                        if (collapseToggle) {
                            collapseToggle.innerHTML = '<span class="text-xl">◀</span><span class="sidebar-text text-sm">Collapse</span>';
                        }
                    } else {
                        sidebar.style.width = '64px';
                        if (main) {
                            main.classList.remove('md:ml-64');
                            main.classList.add('md:ml-16');
                        }
                        if (collapseToggle) {
                            collapseToggle.innerHTML = '<span class="text-xl">▶</span><span class="sidebar-text text-sm">Expand</span>';
                        }
                    }
                } else {
                    sidebar.classList.add('-translate-x-full');
                    sidebar.classList.remove('collapsed');
                    sidebar.style.width = '256px';
                    if (main) {
                        main.classList.remove('md:ml-64', 'md:ml-16');
                    }
                    if (overlay) overlay.classList.add('hidden');
                }
            });

            if (window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
                sidebar.classList.remove('collapsed');
                sidebar.style.width = '256px';
                if (main) {
                    main.classList.remove('md:ml-64', 'md:ml-16');
                }
            } else {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.remove('collapsed');
                sidebar.style.width = '256px';
                if (main) {
                    main.classList.remove('md:ml-16');
                    main.classList.add('md:ml-64');
                }
            }
        }

        // =============================================
        // INITIALIZE
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadWatchLater();
            setupSidebar();
        });
    </script>

</body>
</html>
